name: Controlled WebRTC A
on:
  push:
    branches: [work/metadata-control]
  workflow_dispatch:
    inputs:
      published:
        description: Test the actual published URL
        type: boolean
        default: false
      metadata:
        description: Repeat the one-shot native metadata diagnostic
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  owned-seeder:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: google-chrome --version
      - name: Real temporary seeder, BEP9, piece verification and A playback
        run: node scripts/check-a-control.mjs
        env:
          CONTROL_BASE_URL: ${{ inputs.published && 'https://mawrikborug.github.io/kadr-video-lab/' || 'http://127.0.0.1:4173/kadr-video-lab/' }}
          CONTROL_EVIDENCE_DIR: artifacts/a-control
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
          CONTROL_HOLD_MS: ${{ inputs.published && '180000' || '0' }}
      - name: Recheck actual found releases and closed search actions
        run: node scripts/check-followup-live.mjs
        env:
          CONTROL_BASE_URL: ${{ inputs.published && 'https://mawrikborug.github.io/kadr-video-lab/' || 'http://127.0.0.1:4173/kadr-video-lab/' }}
          FOLLOWUP_EVIDENCE_DIR: artifacts/a-control/found-delivery
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: controlled-A-${{ github.run_id }}
          path: artifacts/a-control
          if-no-files-found: error
          retention-days: 30
  metadata:
    if: github.event_name == 'workflow_dispatch' && inputs.metadata
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y python3-libtorrent
      - name: One-shot metadata only, no media pieces
        run: /usr/bin/python3 scripts/resolve-control-metadata.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: metadata-control-${{ github.run_id }}
          path: artifacts/metadata-control
          if-no-files-found: error
          retention-days: 30
