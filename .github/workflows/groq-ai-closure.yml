name: Groq plain diagnostic (two calls, isolated branch)
on:
  workflow_dispatch:
    inputs:
      confirm_budget:
        description: "Two plain Groq calls only; existing Free connection, no retry, no publication"
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: groq-access-probe
  cancel-in-progress: false
jobs:
  closure:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'MawrikBorug/kadr-video-lab' &&
      github.actor == github.repository_owner &&
      github.ref == 'refs/heads/diagnostic/groq-plain-2026-10-29' &&
      github.workflow_ref == 'MawrikBorug/kadr-video-lab/.github/workflows/groq-ai-closure.yml@refs/heads/diagnostic/groq-plain-2026-10-29' &&
      github.run_attempt == 1 && inputs.confirm_budget
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Two plain responses only
        run: python3 scripts/groq-plain-diagnostic.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - name: Exact prompts, plain answers, safe usage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: groq-plain-diagnostic-${{ github.run_id }}
          path: artifacts/groq-plain-diagnostic/
          retention-days: 7
          if-no-files-found: error
