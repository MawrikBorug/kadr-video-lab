name: Groq AI closure (manual)
on:
  workflow_dispatch:
    inputs:
      confirm_budget:
        description: "Remaining analyses and vision only: up to20 Free Groq requests/158000 reserved tokens; run alone with sufficient daily quota and ZDR enabled"
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: groq-access-probe
  cancel-in-progress: false
jobs:
  closure:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'MawrikBorug/kadr-video-lab' &&
      github.actor == github.repository_owner &&
      github.ref == 'refs/heads/feat/ai-user-flows' &&
      github.workflow_ref == 'MawrikBorug/kadr-video-lab/.github/workflows/groq-ai-closure.yml@refs/heads/feat/ai-user-flows' &&
      github.run_attempt == 1 && inputs.confirm_budget
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Offline closure controls
        run: npm ci --ignore-scripts
      - name: Remaining AI cases, one bounded run
        run: node scripts/ai-live-eval.mjs --review-only
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          KADR_REVIEW_MODEL: openai/gpt-oss-20b
      - name: Safe evidence for independent review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai-live-eval-${{ github.run_id }}
          path: artifacts/ai-live-eval/
          retention-days: 7
          if-no-files-found: ignore
