name: Gemini access probe (manual)

on:
  workflow_dispatch:
    inputs:
      confirm_one_request:
        description: Send one synthetic request using the existing Free Gemini key
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: gemini-access-probe
  cancel-in-progress: false

jobs:
  probe:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'MawrikBorug/kadr-video-lab' &&
      github.actor == github.repository_owner &&
      github.ref == 'refs/heads/main' &&
      github.workflow_ref == 'MawrikBorug/kadr-video-lab/.github/workflows/gemini-probe.yml@refs/heads/main' &&
      github.run_attempt == 1 && inputs.confirm_one_request
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Offline safety tests (no secret)
        run: python3 -m unittest discover -s tests -p gemini_probe_test.py
      - name: Send exactly one request and emit only allowlisted evidence
        run: python3 scripts/gemini-probe.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Preserve only the safe report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gemini-access-probe-${{ github.run_id }}
          path: artifacts/gemini-probe/report.json
          if-no-files-found: ignore
          retention-days: 7
